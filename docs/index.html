<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heart Rate HIIT Pacer</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="titlebar">
    <span class="app-name">HR HIIT Pacer<span id="app-version"></span></span>
    <button id="menu-button" class="menu-button" aria-label="Menu" aria-expanded="false" aria-controls="menu">&#9776;</button>
    <nav id="menu" class="menu" hidden>
      <a href="#monitor">Monitor</a>
      <a href="#profile">Select profile</a>
      <a href="#select-workout">Select workout</a>
    </nav>
  </header>

  <div id="reconnecting-banner" class="banner" hidden>Connection lost. Reconnecting&hellip;</div>

  <main>
    <section id="screen-monitor" class="screen" data-screen="monitor" hidden>
      <h1>Monitor</h1>
      <p id="monitor-error" class="error"></p>

      <div id="monitor-disconnected">
        <p id="monitor-status" class="muted">Not connected.</p>
        <button id="connect-button" class="primary">Connect</button>
      </div>

      <div id="monitor-connected" hidden>
        <p id="monitor-device" class="muted"></p>
        <p id="monitor-bpm" class="bpm">--</p>
        <p class="muted">bpm</p>
        <p id="monitor-zone" class="zone" hidden></p>
        <p id="monitor-profile" class="muted">No profile selected</p>
        <p id="monitor-detail" class="muted"></p>
        <button id="disconnect-button" class="secondary">Disconnect</button>
      </div>

      <div class="screen-footer">
        <button id="select-profile-button" class="primary" hidden>Select profile</button>
      </div>
    </section>

    <section id="screen-profile" class="screen" data-screen="profile" hidden>
      <h1>Select profile</h1>

      <div id="profile-list" class="choice-list"></div>

      <div id="profile-detail" hidden>
        <h2 id="profile-name"></h2>
        <table class="zones">
          <thead><tr><th>Zone</th><th>bpm</th></tr></thead>
          <tbody id="profile-zones"></tbody>
        </table>
      </div>

      <div id="profile-footer" class="screen-footer" hidden>
        <button id="select-workout-button" class="primary">Select workout</button>
      </div>
    </section>

    <section id="screen-select-workout" class="screen" data-screen="select-workout" hidden>
      <h1>Select workout</h1>
      <p class="muted">Not implemented.</p>
    </section>
  </main>
</body>
</html>
