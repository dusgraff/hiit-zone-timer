<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR Connect Prototype</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      text-align: center;
    }
    main { padding: 1rem; }
    button {
      font-size: 1.25rem;
      padding: 0.9rem 1.6rem;
      border: none;
      border-radius: 0.5rem;
      background: #d33;
      color: #fff;
      margin: 0.5rem;
    }
    button:disabled { opacity: 0.4; }
    #bpm { font-size: 6rem; font-weight: bold; margin: 1rem 0 0; }
    #unit { color: #999; margin: 0 0 1rem; }
    #status, #detail { color: #999; }
    #error { color: #f77; }
  </style>
</head>
<body>
  <main>
    <h1>Heart Rate Connect</h1>
    <button id="connect">Connect to Bluetooth</button>
    <button id="disconnect" hidden>Disconnect</button>
    <p id="bpm">--</p>
    <p id="unit">bpm</p>
    <p id="status">Not connected.</p>
    <p id="detail"></p>
    <p id="error"></p>
  </main>
  <script>
    const connectBtn = document.getElementById('connect');
    const disconnectBtn = document.getElementById('disconnect');
    const bpmEl = document.getElementById('bpm');
    const statusEl = document.getElementById('status');
    const detailEl = document.getElementById('detail');
    const errorEl = document.getElementById('error');

    let device = null;

    if (!('bluetooth' in navigator)) {
      connectBtn.disabled = true;
      errorEl.textContent = window.isSecureContext
        ? 'Web Bluetooth is not available in this browser. Use Chrome on Android.'
        : 'Web Bluetooth needs HTTPS. Open this page over https:// (or localhost).';
    }

    connectBtn.addEventListener('click', async () => {
      errorEl.textContent = '';
      try {
        // Opens the browser's device picker, showing only heart rate monitors.
        device = await navigator.bluetooth.requestDevice({
          filters: [{ services: ['heart_rate'] }],
          optionalServices: ['battery_service'],
        });
        device.addEventListener('gattserverdisconnected', onDisconnected);

        connectBtn.disabled = true;
        statusEl.textContent = 'Connecting to ' + (device.name || 'device') + '...';

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('heart_rate');
        const characteristic = await service.getCharacteristic('heart_rate_measurement');
        characteristic.addEventListener('characteristicvaluechanged', onHeartRate);
        await characteristic.startNotifications();

        statusEl.textContent = 'Connected to ' + (device.name || 'device') + '.';
        connectBtn.hidden = true;
        disconnectBtn.hidden = false;

        readBattery(server);
      } catch (err) {
        connectBtn.disabled = false;
        // NotFoundError means the user closed the picker without choosing.
        if (err.name === 'NotFoundError') {
          statusEl.textContent = 'No device selected.';
        } else {
          statusEl.textContent = 'Not connected.';
          errorEl.textContent = err.name + ': ' + err.message;
        }
        if (device && device.gatt.connected) device.gatt.disconnect();
      }
    });

    disconnectBtn.addEventListener('click', () => {
      if (device && device.gatt.connected) device.gatt.disconnect();
    });

    function onDisconnected() {
      statusEl.textContent = 'Disconnected.';
      bpmEl.textContent = '--';
      detailEl.textContent = '';
      connectBtn.hidden = false;
      connectBtn.disabled = false;
      disconnectBtn.hidden = true;
    }

    // Parses the standard BLE Heart Rate Measurement characteristic (0x2A37).
    function onHeartRate(event) {
      const data = event.target.value;
      const flags = data.getUint8(0);
      const is16Bit = flags & 0x01;
      const contactSupported = flags & 0x04;
      const contactDetected = flags & 0x02;
      const hasEnergy = flags & 0x08;
      const hasRR = flags & 0x10;

      let offset = 1;
      const bpm = is16Bit ? data.getUint16(offset, true) : data.getUint8(offset);
      offset += is16Bit ? 2 : 1;
      if (hasEnergy) offset += 2;

      const rr = [];
      if (hasRR) {
        for (; offset + 1 < data.byteLength; offset += 2) {
          rr.push(Math.round(data.getUint16(offset, true) / 1024 * 1000));
        }
      }

      bpmEl.textContent = bpm;
      const parts = [];
      if (contactSupported) parts.push('Skin contact: ' + (contactDetected ? 'yes' : 'no'));
      if (rr.length) parts.push('RR: ' + rr.join(', ') + ' ms');
      detailEl.textContent = parts.join(' · ');
    }

    async function readBattery(server) {
      try {
        const service = await server.getPrimaryService('battery_service');
        const level = await service.getCharacteristic('battery_level');
        const value = await level.readValue();
        statusEl.textContent += ' Battery ' + value.getUint8(0) + '%.';
      } catch (_) {
        // Battery is optional; ignore if the device doesn't expose it.
      }
    }
  </script>
</body>
</html>
